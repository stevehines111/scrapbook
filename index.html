<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrapbook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='19' height='22' rx='3' transform='rotate(-10 12 17)' fill='%23F2545B'/%3E%3Crect x='11' y='4' width='18' height='21' rx='3' transform='rotate(7 20 14)' fill='%23fff' stroke='%231E1B1A' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style id="page-size">@page { size: 13in 19in; margin: 0; }</style>
<style>
:root {
  --accent: #F2545B;
  --accent-hover: #E3434A;
  --accent-ink: #C8313A;
  --accent-soft: rgba(242, 84, 91, .12);
  --ink: #1E1B1A;
  --ink-2: #5F5955;
  --ink-3: #9A938E;
  --desk: #ECE8E3;
  --panel: #FFFFFF;
  --line: #E9E4DF;
  --fill: #F4F1EE;
  --fill-2: #EAE6E1;
  --shadow-pop: 0 12px 32px rgba(40, 28, 20, .16), 0 2px 6px rgba(40, 28, 20, .08);
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  color: var(--ink);
  background: var(--desk);
  display: grid;
  grid-template-rows: 58px minmax(0, 1fr);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* Top bar */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  padding: 0 14px 0 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
@media (max-width: 1399px) { .brand .wordmark { display: none; } }   /* room for the saved status on a laptop screen */
.center-controls { display: flex; align-items: center; gap: 10px; }
.right-controls { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font-weight: 500;
  height: 32px; padding: 0 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04); }
.seg.icons button { width: 36px; padding: 0; }
.icon-btn {
  width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; cursor: pointer;
  display: inline-grid; place-items: center; color: var(--ink);
}
.icon-btn:hover:not(:disabled) { background: var(--fill); }
.icon-btn:disabled { color: #C9C3BE; cursor: default; }
.group { display: flex; align-items: center; gap: 2px; }
.zoom { display: flex; align-items: center; background: var(--fill); border-radius: 11px; padding: 3px; }
.zoom .icon-btn { width: 32px; height: 32px; border-radius: 8px; }
.zoom .icon-btn:hover:not(:disabled) { background: #fff; }
.zoom-pct { min-width: 48px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.zoom .fit { border: 0; background: transparent; height: 32px; padding: 0 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
.zoom .fit:hover, .zoom .fit[aria-pressed="true"] { background: #fff; }
.primary {
  border: 0; background: var(--accent); color: #fff; font-weight: 600; height: 38px; padding: 0 18px 0 14px;
  border-radius: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 1px 2px rgba(200, 40, 50, .25), 0 4px 12px -2px rgba(242, 84, 91, .45);
}
.primary:hover:not(:disabled) { background: var(--accent-hover); }
.primary:disabled { background: #F4B3B6; box-shadow: none; cursor: default; }
.btn {
  border: 0; background: var(--fill); color: var(--ink); font-weight: 600; height: 34px; padding: 0 14px;
  border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--fill-2); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.dark:hover { background: #3A3533; }
.btn svg.i { width: 16px; height: 16px; }
.btn.organize { height: 38px; border-radius: 11px; padding: 0 15px 0 12px; }
.btn.organize:disabled, .btn.organize:disabled:hover { background: var(--fill); color: #C9C3BE; cursor: default; }
.split { display: inline-flex; position: relative; }
.split .btn.organize { border-radius: 11px 0 0 11px; }
.split .organize-more { height: 38px; width: 32px; padding: 0; justify-content: center; border-radius: 0 11px 11px 0; margin-left: 1px; background: var(--fill-2); }
.split .organize-more:hover:not(:disabled) { background: #DFDAD4; }
.split .organize-more:disabled { background: var(--fill); color: #C9C3BE; cursor: default; }
.split .organize-more[aria-expanded="true"] { background: #DFDAD4; }
.menu {
  position: absolute; top: 46px; left: 0; min-width: 100%; z-index: 40; background: #fff; border-radius: 12px;
  box-shadow: var(--shadow-pop); border: 1px solid rgba(0,0,0,.05); padding: 6px; display: grid; gap: 2px;
}
.menu button {
  height: 38px; border: 0; background: transparent; border-radius: 8px; padding: 0 12px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; white-space: nowrap; text-align: left;
}
.menu button:hover:not(:disabled) { background: var(--fill); }
.menu button:disabled { color: #C9C3BE; cursor: default; }
.menu button small { font-weight: 500; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.left-controls { display: flex; align-items: center; gap: 14px; min-width: 0; }
.file-wrap { position: relative; }
.btn.file { height: 36px; padding: 0 8px 0 13px; gap: 4px; }
.btn.file[aria-expanded="true"] { background: var(--fill-2); }
.file-wrap .menu { min-width: 228px; }
.save-state { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 13px; font-weight: 500; white-space: nowrap; }
.save-state svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
.save-state.bad { color: var(--accent-ink); font-weight: 600; }
.save-state .use { border: 0; background: var(--ink); color: #fff; font-weight: 600; font-size: 12px; height: 26px; padding: 0 10px; border-radius: 7px; margin-left: 4px; cursor: pointer; }
.save-state .use:hover { background: #3A3533; }
.print-split #print-btn { border-radius: 11px 0 0 11px; }
.print-split .print-more { width: 32px; padding: 0; justify-content: center; border-radius: 0 11px 11px 0; margin-left: 1px; }
.print-split .print-more[aria-expanded="true"] { background: var(--accent-hover); }
.print-split .menu { left: auto; right: 0; min-width: 210px; }

/* Main */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 0; }
.tray { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tray-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; gap: 8px; }
.tray-head h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.count { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--fill); border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.tray-body { flex: 1; overflow-y: auto; padding: 2px 16px 16px; }
.progress { margin: 0 16px 12px; padding: 10px 12px; background: var(--fill); border-radius: 10px; font-size: 13px; font-weight: 500; }
.progress .bar { height: 4px; background: #fff; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 4px; transition: width .2s; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thumb {
  position: relative; aspect-ratio: 1 / 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden;
  background: var(--fill); cursor: grab; touch-action: pan-y; display: block; width: 100%;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; transition: transform .2s ease; }
.cell { position: relative; }
.cell:hover .thumb img { transform: scale(1.04); }
.badge {
  position: absolute; top: 6px; right: 6px; background: rgba(30, 27, 26, .86); color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 999px; padding: 2px 7px; font-variant-numeric: tabular-nums; pointer-events: none;
}
.thumb-x {
  position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  background: rgba(30, 27, 26, .86); color: #fff; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  opacity: 0; transition: opacity .12s;
}
.thumb-x svg.i { width: 13px; height: 13px; stroke-width: 2.6; }
.thumb-x:hover { background: #D2333B; }
.cell:hover .thumb-x, .cell:focus-within .thumb-x { opacity: 1; }
@media (hover: none) { .thumb-x { opacity: 1; } }
.tray-foot { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; gap: 8px; }
.tray-foot .btn { flex: 1; justify-content: center; }
.tray-foot .btn .count { background: #fff; }
.tray-foot .btn:disabled, .tray-foot .btn:disabled:hover { background: var(--fill); color: #C9C3BE; cursor: default; }
.empty {
  border: 1.5px dashed #D8D0C9; border-radius: 16px; padding: 30px 16px 22px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px; background: #FBFAF8;
}
.empty .ring { width: 52px; height: 52px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--ink-2); }
.empty .ring svg.i { width: 24px; height: 24px; }
.empty p { margin: 0; font-weight: 600; font-size: 14px; line-height: 1.35; max-width: 190px; text-wrap: balance; }
.link { border: 0; background: none; padding: 2px; color: var(--ink-2); font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--ink); }

/* Google Photos */
.tray:not(.gp-on) .gp-only { display: none !important; }
.gp-btn:disabled { opacity: .5; cursor: default; }
.gp-row { padding: 0 16px 12px; }
.gp-row .btn { width: 100%; justify-content: center; }
.empty-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.empty-actions .btn { justify-content: center; }
.empty .gp-btn { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.empty .gp-btn:hover:not(:disabled) { background: var(--fill); }
.gp-panel { margin: 0 16px 12px; padding: 12px; background: var(--fill); border-radius: 12px; display: grid; gap: 10px; }
.gp-wait { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; min-height: 36px; }
.gp-spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid rgba(30, 27, 26, .16); border-top-color: var(--ink); animation: gp-spin .8s linear infinite; }
@keyframes gp-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .gp-spin { animation-duration: 2.4s; } }
.gp-pick { width: 100%; height: 44px; justify-content: center; font-size: 15px; padding: 0 18px; }
.gp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gp-foot .btn { height: 30px; padding: 0 12px; background: #fff; font-size: 13px; }
.gp-foot .btn:hover { background: var(--fill-2); }

.center { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.desk { flex: 1; overflow: auto; position: relative; background: var(--desk); }
.stage { position: relative; }
.sheet-wrap { position: absolute; }
.sheet {
  position: absolute; inset: 0; z-index: 0; background: #fff; border-radius: 2px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(40, 30, 20, .10), 0 12px 32px -8px rgba(40, 30, 20, .22);
}
.safe { position: absolute; border: 1px dashed rgba(30, 27, 26, .22); pointer-events: none; }
.items { position: absolute; inset: 0; }
.item { position: absolute; overflow: hidden; cursor: move; touch-action: none; background: #EFEBE7; }
.item img { position: absolute; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.lowres {
  position: absolute; top: 6px; left: 6px; display: none; background: #FFD84D; color: #3A2E00; font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.25); white-space: nowrap; pointer-events: none;
}
.item.is-low .lowres { display: block; }
.overlay { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.guide { position: absolute; background: var(--accent); pointer-events: none; }
.crop-ghost { position: absolute; max-width: none; opacity: .38; pointer-events: auto; cursor: grab; touch-action: none; -webkit-user-drag: none; }
.crop-ghost:active { cursor: grabbing; }
.selbox { position: absolute; outline: 2px solid var(--accent); pointer-events: none; }
.selbox.cropping .h { display: none; }
.selbox.small .h.s { display: none; }
.h { position: absolute; pointer-events: auto; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); touch-action: none; }
.h::after { content: ""; position: absolute; inset: -9px; }
.h.c { width: 14px; height: 14px; border-radius: 50%; margin: -7px 0 0 -7px; }
.h.nw { left: 0; top: 0; cursor: nwse-resize; }
.h.ne { left: 100%; top: 0; cursor: nesw-resize; }
.h.sw { left: 0; top: 100%; cursor: nesw-resize; }
.h.se { left: 100%; top: 100%; cursor: nwse-resize; }
.h.s-n, .h.s-s { width: 24px; height: 8px; border-radius: 4px; left: 50%; margin: -4px 0 0 -12px; cursor: ns-resize; }
.h.s-n { top: 0; } .h.s-s { top: 100%; }
.h.s-e, .h.s-w { width: 8px; height: 24px; border-radius: 4px; top: 50%; margin: -12px 0 0 -4px; cursor: ew-resize; }
.h.s-w { left: 0; } .h.s-e { left: 100%; }
.live {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, 12px); background: var(--ink); color: #fff;
  font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums;
}

.toolbar {
  position: absolute; z-index: 20; display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  background: #fff; border-radius: 14px; padding: 6px; box-shadow: var(--shadow-pop); border: 1px solid rgba(0,0,0,.04);
  max-width: calc(100% - 16px);
}
.tb-readout { font-weight: 700; font-size: 13px; padding: 0 8px 0 8px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 78px; text-align: center; }
.tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 3px; }
.chip {
  height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--fill); font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
}
.chip:hover { background: var(--fill-2); }
.chip.on { background: var(--accent-soft); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
.tb-btn { width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; display: inline-grid; place-items: center; }
.tb-btn:hover { background: var(--fill); }
.tb-btn.danger:hover { color: #D2333B; background: #FDECEC; }
.tb-label { font-weight: 700; font-size: 13px; padding: 0 6px 0 8px; }
.tb-zoom { display: flex; align-items: center; gap: 8px; padding: 0 6px; color: var(--ink-2); }
.tb-zoom svg.i { width: 16px; height: 16px; }
.tb-zoom input { width: 150px; accent-color: var(--accent); cursor: pointer; }
.tb-zoom input:focus-visible { outline: none; }
.tb-done { height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 600; cursor: pointer; }
.tb-done:hover { background: #3A3533; }

.tabs {
  height: 50px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: var(--desk);
  border-top: 1px solid rgba(40, 30, 20, .07); overflow-x: auto;
}
.tab { display: flex; align-items: center; height: 34px; border-radius: 10px; flex: none; }
.tab:hover { background: rgba(255,255,255,.5); }
.tab.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab-main { border: 0; background: transparent; height: 100%; padding: 0 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tab.on .tab-main { color: var(--ink); }
.tab.closable .tab-main { padding-right: 4px; }
.tab-size { font-weight: 500; font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.tab-x { width: 24px; height: 24px; margin-right: 5px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; }
.tab-x svg.i { width: 14px; height: 14px; }
.tab-x:hover { background: var(--fill); color: var(--ink); }
.tab-add { border: 0; background: transparent; height: 34px; padding: 0 12px 0 9px; border-radius: 10px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; flex: none; }
.tab-add svg.i { width: 16px; height: 16px; }
.tab-add:hover { background: rgba(255,255,255,.6); color: var(--ink); }

.drag-ghost { position: fixed; z-index: 100; pointer-events: none; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: .92; transform: translate(-50%, -50%); }
.drag-ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }
.drag-ghost.on-sheet { border-radius: 0; outline: 2px solid var(--accent); }

.popover {
  position: fixed; top: 66px; right: 14px; width: 330px; z-index: 50; background: #fff; border-radius: 16px;
  box-shadow: var(--shadow-pop); border: 1px solid rgba(0,0,0,.05); padding: 18px 18px 16px;
}
.popover h3 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
.facts { margin: 0; display: grid; gap: 2px; }
.facts > div { display: grid; grid-template-columns: 104px 1fr; gap: 10px; padding: 8px 10px; border-radius: 9px; align-items: baseline; }
.facts > div:nth-child(odd) { background: #FAF8F6; }
.facts dt { color: var(--ink-2); font-weight: 500; }
.facts dd { margin: 0; font-weight: 700; }
.facts dd small { display: block; font-weight: 500; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.facts > div.hl { background: #FFF6D6; }
.switch-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 4px; font-weight: 600; cursor: pointer; }
.switch { position: relative; width: 40px; height: 24px; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: #D6D0CA; transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + i { background: var(--ink); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.pp-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.pdf-which { display: flex; margin-bottom: 12px; }
.pdf-which button { flex: 1; }
.pdf-which button:disabled { color: #C9C3BE; cursor: default; }
.pp-actions .primary { height: 36px; padding: 0 20px; }

.toast {
  position: fixed; left: calc(50% + 130px); bottom: 64px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff;
  border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 14px; font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); white-space: nowrap;
}
.toast button { border: 0; background: rgba(255,255,255,.14); color: #fff; font-weight: 700; height: 28px; padding: 0 12px; border-radius: 8px; cursor: pointer; }
.toast button:hover { background: rgba(255,255,255,.24); }
.drop-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(30, 27, 26, .35); display: grid; place-items: center; pointer-events: none; }
.drop-overlay div { background: #fff; border-radius: 18px; padding: 26px 34px; font-weight: 700; font-size: 17px; box-shadow: var(--shadow-pop); border: 2px dashed #CFC6BE; }

#print-root { display: none; }
@media print {
  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; height: auto !important; overflow: visible !important; }
  body { display: block !important; }

const scripts = {};
function loadLib(name) {
  if (!scripts[name]) scripts[name] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = LIBS[name].src; s.integrity = LIBS[name].integrity; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = () => { delete scripts[name]; rej(new Error('Could not load ' + name)); };

function loadImg(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.decoding = 'async';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Unreadable image'));

function scaledBlob(img, max, q) {
  const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => {
    try { c.toBlob(b => (b ? res(b) : rej(new Error('toBlob failed'))), 'image/jpeg', q); }
    catch (err) { rej(err); }   // tainted canvas (sample opened from a local file)
  });
}
// Adds a photo record to the map with object URLs for its images, and saves it on this computer unless it came from
// there. added keeps the tray order through a refresh.
function addPhoto(rec, fullUrl, stored = false) {
  const full = fullUrl || (rec.blob ? URL.createObjectURL(rec.blob) : '');
  const p = { ...rec, full, stored, added: rec.added || Date.now() * 1000 + (store.added++ % 1000),
    thumb: rec.thumbBlob ? URL.createObjectURL(rec.thumbBlob) : full,
    preview: rec.previewBlob ? URL.createObjectURL(rec.previewBlob) : full };

// the original for printing. Returns the photo id.
async function ingestBlob(blob, name, id = uid('p')) {
  const url = URL.createObjectURL(blob);
  let img;
  try { img = await loadImg(url); } catch (err) { URL.revokeObjectURL(url); throw err; }
  const w = img.naturalWidth, h = img.naturalHeight;

    thumbBlob = await scaledBlob(img, 400, 0.82);
    if (Math.max(w, h) > 2000) previewBlob = await scaledBlob(img, 2000, 0.9);
  } catch (err) { thumbBlob = previewBlob = null; }
  addPhoto({ id, name, w, h, blob, thumbBlob, previewBlob }, url);

async function addFiles(fileList) {
  const files = [...fileList];
  if (!files.length || busy) return;
  busy = true;
  let skipped = 0, failed = 0, project = null;
  const jobs = [];
  try {
    for (const f of files) {
      if (isZip(f) || isScrapbook(f)) {
        showProgress('Opening zip…');
        try {
          await loadLib('jszip');
          const zip = await window.JSZip.loadAsync(f);
          if (zip.file(PROJECT_JSON)) { if (!project) project = { zip, name: f.name }; else skipped++; continue; }
          if (isScrapbook(f)) throw new Error('Not a scrapbook file');
          const entries = [];
          zip.forEach((path, entry) => {
            const base = path.split('/').pop();
            if (entry.dir || path.includes('__MACOSX/') || base.startsWith('.')) return;
            if (IMG_EXT.test(base)) entries.push({ path, base, entry }); else skipped++;

// Polls at the interval Google asks for, stops at its timeout, and pauses while this tab is hidden.

    await gpSleep(Math.max(1000, wait));
    if (run !== gp.run) return 'cancelled';
    if (document.hidden) await new Promise(res => {

  if (busy) return;
  const used = useCounts(), gone = new Set(doc.hidden);
  const keep = [...photos.values()].filter(p => p.blob && (!gone.has(p.id) || used.has(p.id)));
  if (!keep.length) return;
  busy = true;
  toast('Saving scrapbook file…', null, true);
  try {
    await loadLib('jszip');
    const zip = new window.JSZip();
    const d = JSON.parse(snap());
    d.hidden = d.hidden.filter(id => keep.some(p => p.id === id));
    const list = keep.map((p, i) => {
      const file = `photos/${String(i + 1).padStart(3, '0')}.${TYPE_EXT[p.blob.type] || extOf(p.name) || 'jpg'}`;
      zip.file(file, p.blob);
      return { id: p.id, name: p.name, file };
    });
    zip.file(PROJECT_JSON, JSON.stringify({ app: 'scrapbook', version: PROJECT_VERSION, saved: new Date().toISOString(), cutMarks: ui.cutMarks, doc: d, photos: list }));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE', mimeType: 'application/octet-stream' });
    download(blob, `Scrapbook ${today()}.scrapbook`);
    toast('Scrapbook file saved');
  } catch (err) {
    console.error('Save scrapbook file:', err);
    toast('Couldn’t save the scrapbook file');
  } finally { busy = false; }
}
async function openScrapbookFile(file) {
  if (busy) return;
  busy = true;
  try {
    showProgress('Opening scrapbook file…');
    await loadLib('jszip');
    const zip = await window.JSZip.loadAsync(file);
    if (!zip.file(PROJECT_JSON)) throw new Error('No ' + PROJECT_JSON);
    await openProject(zip, file.name);
  } catch (err) {
    console.error('Open scrapbook file:', err);
    toast('That isn’t a scrapbook file');
  } finally { busy = false; hideProgress(); }
}
// The caller holds busy. Every id is new, so nothing in the file can collide with what is here.
async function openProject(zip, fileName) {
  let meta = null;
  try { meta = JSON.parse(await zip.file(PROJECT_JSON).async('string')); } catch (err) { /* not JSON */ }
  if (!meta || meta.app !== 'scrapbook' || !Array.isArray(meta.photos)) { toast('That isn’t a scrapbook file'); return false; }
  if (+meta.version > PROJECT_VERSION) { toast('Made by a newer Scrapbook: refresh the page'); return false; }
  if (ui.crop) endCrop();
  const ids = new Map();   // id in the file -> new id
  for (const ph of meta.photos) if (ph && typeof ph.file === 'string' && zip.file(ph.file) && !ids.has(ph.id)) ids.set(ph.id, uid('p'));
  hideEverywhere([...ids.values()]);
  progress.total = ids.size; progress.done = 0;
  showProgress(`Opening ${ids.size} photo${ids.size === 1 ? '' : 's'}…`);
  const ok = new Set();
  let failed = 0;
  for (const ph of meta.photos) {
    const id = ids.get(ph && ph.id);
    if (!id || ok.has(id)) continue;
    try {
      const raw = await zip.file(ph.file).async('blob');
      const blob = await toDisplayable(new Blob([raw], { type: MIME[extOf(ph.file)] || '' }), ph.file);
      await ingestBlob(blob, String(ph.name || ph.file.split('/').pop()), id);
      ok.add(id);
    } catch (err) { failed++; console.error(`Open scrapbook file: couldn’t read ${ph.file}`, err); }
    stepProgress();
  }
  const d = meta.doc || {};
  const next = cleanDoc({
    sheets: (Array.isArray(d.sheets) ? d.sheets : []).map(s => s && ({ ...s, id: uid('s'),
      items: (Array.isArray(s.items) ? s.items : []).map(it => it && ({ ...it, id: uid('i'), src: ids.get(it.src) })) })),
    current: d.current,
    hidden: (Array.isArray(d.hidden) ? d.hidden : []).map(id => ids.get(id)),
  }, ok);
  next.hidden = [...new Set([...next.hidden, ...[...photos.keys()].filter(id => !ok.has(id))])];
  change(() => { doc = next; ui.sel = null; ui.zoom = 'fit'; });
  if (typeof meta.cutMarks === 'boolean') ui.cutMarks = meta.cutMarks;
  const title = fileName.replace(/\.(scrapbook|zip)$/i, '');
  toast(`Opened ${title}` + (failed ? ` · ${failed} photo${failed === 1 ? '' : 's'} couldn’t be read` : ''), { label: 'Undo', fn: undo });
  return true;
}

/* ---------- Global pointer, keyboard, leaving ---------- */
document.addEventListener('pointerdown', e => {
  if (!panel.hidden && !panel.contains(e.target) && !e.target.closest('#print-btn')) closePanel();
  if (!pdfPanel.hidden && !pdfPanel.contains(e.target)) pdfPanel.hidden = true;
  const m = openMenuName();
  if (m && !$(MENUS[m][0]).parentElement.contains(e.target)) closeMenu(m);
  if (ui.crop && !stage.contains(e.target) && !toolbar.contains(e.target)) { endCrop(); render(); }
}, true);
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('input[type=text], input[type=number], textarea, [contenteditable]')) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); duplicateItem(); return; }
  if (mod && (k === 'p' || k === 'P')) { e.preventDefault(); openPrintPanel(); return; }
  if (mod) return;
  if ((k === 'Delete' || k === 'Backspace') && t.classList && t.classList.contains('thumb')) {
    e.preventDefault(); removeTrayPhoto(t.dataset.id); return;
  }
  if (k === 'Escape') {
    const m = openMenuName();
    if (m) { closeMenu(m); $(MENUS[m][0]).focus(); return; }
    if (!panel.hidden || !pdfPanel.hidden) { closePanels(); return; }
    if (ui.crop) { endCrop(); render(); return; }
    if (ui.sel) { ui.sel = null; render(); }
    return;
  }
  if (k === 'Enter' && ui.crop) { e.preventDefault(); endCrop(); render(); return; }
  if (!ui.sel || ui.gesture) return;
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteItem(); return; }
  if (t.matches && t.matches('input[type=range]')) return;
  if (k.startsWith('Arrow') && !ui.crop) {
    e.preventDefault();
    const st = e.shiftKey ? 0.25 : 1 / 16;
    nudge(k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0);
  }
});
// Asks before leaving only when work would be lost: a save still writing, or a tab that isn't saving.
window.addEventListener('beforeunload', e => {
  let lose;
  if (canSave()) { saveNow(); lose = store.writes > 0; }
  else if (store.db) lose = editedHere();
  else lose = doc.sheets.some(s => s.items.length);
  if (lose) { e.preventDefault(); e.returnValue = ''; }
});

// Read-only view of the layout, for checking print sizes from the console.
window.scrapbook = {
  state: () => JSON.parse(snap()),
  photos: () => [...photos.values()].map(p => ({ id: p.id, name: p.name, w: p.w, h: p.h, stored: p.stored })),
  saving: () => ({ db: !!store.db, owner: store.owner, writes: store.writes, error: store.error, pending: !!store.timer }),
};

render();
boot();
})();
</script>
